<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0d1b40">
<title>Aliança HQ</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230d1b40'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23f2b705'/%3E%3C/svg%3E">
<link rel="stylesheet" href="hq.css">
</head>
<body>

<!-- LINHA PÚBLICA: esta página não guarda dado nenhum. Sem login ela mostra só se a equipe digital está online ou em pausa
     (contagens das linhas hq-pc e hq-servidor). Valores, filas e nomes só chegam do banco depois do login do Gestor. -->

<div class="mastro">
  <header class="topo">
    <div class="marca"><i aria-hidden="true"></i>Aliança HQ</div>
    <button type="button" class="botao-topo" id="botao-entrar">Entrar</button>
  </header>

  <section class="radar" id="radar" aria-live="polite" aria-label="Radar de decisão">
    <p class="radar-linha"><span class="ping" aria-hidden="true"></span><span>Lendo a operação…</span></p>
    <h1>Um instante</h1>
  </section>
</div>

<main>
  <section class="bloco" id="pulso" hidden></section>
  <section class="bloco" id="equipe" aria-label="Equipe digital"></section>
  <section class="bloco" id="esteira" hidden></section>
  <section class="bloco" id="controles" hidden></section>
  <footer class="rodape" id="rodape"></footer>
</main>

<dialog class="gaveta" id="gaveta" aria-labelledby="gaveta-titulo">
  <div class="gaveta-topo">
    <div id="gaveta-cabeca"></div>
    <button type="button" class="fechar" data-fecha aria-label="Fechar">Fechar</button>
  </div>
  <div class="gaveta-corpo" id="gaveta-corpo"></div>
</dialog>

<dialog class="folha" id="login" aria-labelledby="login-titulo">
  <form id="login-form" novalidate>
    <h2 id="login-titulo">Entrar como Gestor</h2>
    <p class="folha-texto">É o mesmo login do Painel. Sem ele, esta página mostra só se a equipe está online.</p>
    <label>E-mail<input id="login-email" type="email" autocomplete="username" inputmode="email" required></label>
    <label>Senha<input id="login-senha" type="password" autocomplete="current-password" required></label>
    <p class="folha-erro" id="login-erro" role="alert"></p>
    <div class="folha-botoes">
      <button type="button" class="botao secundario" data-fecha>Cancelar</button>
      <button type="submit" class="botao" id="login-ok">Entrar</button>
    </div>
  </form>
</dialog>

<dialog class="folha" id="confirma" aria-labelledby="confirma-titulo">
  <h2 id="confirma-titulo"></h2>
  <p class="folha-texto" id="confirma-texto"></p>
  <div class="folha-botoes">
    <button type="button" class="botao secundario" id="confirma-nao">Cancelar</button>
    <button type="button" class="botao" id="confirma-sim"></button>
  </div>
</dialog>

<div class="aviso-flutuante" id="aviso" role="status" hidden></div>

<noscript><p class="sem-js">Esta página precisa de JavaScript para ler o estado da equipe.</p></noscript>

<script src="../config.js"></script>
<script src="hq.js"></script>
</body>
</html>

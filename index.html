<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0d1b40">
<title>Resultados — Aliança</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230d1b40'/%3E%3Crect x='7' y='17' width='4' height='8' fill='%23f2b705'/%3E%3Crect x='14' y='11' width='4' height='14' fill='%23f2b705'/%3E%3Crect x='21' y='6' width='4' height='19' fill='%23f2b705'/%3E%3C/svg%3E">
<link rel="stylesheet" href="resultados.css">
</head>
<body>

<!-- PAINEL DE RESULTADOS: esta página não guarda dado nenhum. Tudo chega do banco depois do login do Gestor (linhas hq-financeiro e v2).
     Sem login ela mostra só o convite para entrar. -->

<header class="topo">
  <div class="topo-dentro">
    <div class="marca"><i aria-hidden="true"></i>Resultados</div>
    <div class="topo-acoes">
      <button type="button" class="botao-topo" id="botao-atualizar" hidden>Atualizar</button>
      <button type="button" class="botao-topo" id="botao-entrar">Entrar</button>
    </div>
  </div>
</header>

<main id="tela" aria-live="polite">
  <section class="porta">
    <h1>Um instante</h1>
    <p>Conferindo o seu acesso…</p>
  </section>
</main>

<dialog class="folha" id="login" aria-labelledby="login-titulo">
  <form id="login-form" novalidate>
    <h2 id="login-titulo">Entrar como Gestor</h2>
    <p class="folha-texto">É o mesmo login do Painel.</p>
    <label>E-mail<input id="login-email" type="email" autocomplete="username" inputmode="email" required></label>
    <label>Senha<input id="login-senha" type="password" autocomplete="current-password" required></label>
    <p class="folha-erro" id="login-erro" role="alert"></p>
    <div class="folha-botoes">
      <button type="button" class="botao secundario" id="login-cancela">Cancelar</button>
      <button type="submit" class="botao" id="login-ok">Entrar</button>
    </div>
  </form>
</dialog>

<noscript><p class="sem-js">Esta página precisa de JavaScript para ler os resultados.</p></noscript>

<script src="config.js"></script>
<script src="resultados.js"></script>
</body>
</html>

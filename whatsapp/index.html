<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ffffff">
<title>Aliança WhatsApp</title>
<!-- App WhatsApp (17/11/2026, etapa 1: só ver). Lê a linha privada 'app-whatsapp' do painel_dados depois do login.
     O pacote é montado no servidor dos robôs (ecossistema/app-whatsapp/montar.js). Nenhum dado de cliente fica neste arquivo. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="../config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js"></script>
<style>
:root{
  --bg:#f4f6f9; --card:#ffffff; --line:#e3e8ef; --line-2:#eef1f5;
  --ink:#0f172a; --ink-2:#475569; --ink-3:#64748b;
  --pri:#0b63ce; --pri-soft:#e7f0fc;
  --ok:#15803d; --ok-soft:#dcfce7; --warn:#a16207; --warn-soft:#fef3c7;
  --bad:#b91c1c; --bad-soft:#fee2e2; --mute-soft:#eef2f6;
  --r:12px; color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
.app{max-width:430px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);min-height:56px;padding:env(safe-area-inset-top,0px) 16px 0;display:flex;align-items:center;justify-content:space-between;gap:8px}
.sync{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.sync.velho{color:var(--warn);font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex-shrink:0}
.dot.ok{background:#22a447}.dot.warn{background:#d4a011}.dot.bad{background:#dc2626}.dot.mute{background:#94a3b8}
main{flex:1;padding:16px 16px 96px;display:flex;flex-direction:column;gap:24px}
.sec{display:flex;flex-direction:column;gap:12px}
.sec-h{display:flex;align-items:center;justify-content:space-between;min-height:24px}
.sec-h h2,.sub-h{margin:0;font-size:13px;font-weight:600;color:var(--ink-2);text-transform:uppercase;letter-spacing:.06em}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.pill{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 8px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.info{background:var(--pri-soft);color:var(--pri)}.pill.mute{background:var(--mute-soft);color:var(--ink-2)}
.count{min-width:24px;height:24px;padding:0 8px;border-radius:999px;font-size:13px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.count.bad{background:var(--bad);color:#fff}.count.ok{background:var(--ok-soft);color:var(--ok)}
.alarm{display:flex;align-items:center;gap:16px;padding:16px;border-radius:var(--r);background:var(--bad);color:#fff;border:0;text-align:left;width:100%}
.alarm .big{font-size:32px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.alarm .lbl{display:flex;flex-direction:column;gap:2px;flex:1}.alarm .lbl b{font-size:15px}.alarm .lbl span{font-size:13px;opacity:.9}
.row{display:flex;align-items:center;gap:12px;width:100%;min-height:64px;padding:12px 16px;border:0;border-bottom:1px solid var(--line-2);background:var(--card);text-align:left}
.row:last-child{border-bottom:0}
button.row:active{background:var(--line-2)}
.ico{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:14px;font-weight:700}
.ico.bad{background:var(--bad-soft);color:var(--bad)}.ico.ok{background:var(--ok-soft);color:var(--ok)}.ico.info{background:var(--pri-soft);color:var(--pri)}.ico.mute{background:var(--mute-soft);color:var(--ink-2)}
.mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.t1{font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px;min-width:0}
.t1 .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t2{font-size:13px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.end{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0}
.time{font-size:13px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.tag{font-size:11px;font-weight:600;padding:2px 6px;border-radius:4px;background:var(--mute-soft);color:var(--ink-2);white-space:nowrap;flex-shrink:0}
.more{width:100%;height:52px;border:0;border-top:1px solid var(--line-2);background:var(--card);color:var(--pri);font-weight:600}
.empty{padding:32px 16px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.empty .ck{width:56px;height:56px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:flex;align-items:center;justify-content:center}
.empty b{font-size:17px}.empty span{font-size:13px;color:var(--ink-3)}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:6px;text-align:left;width:100%}
button.kpi:active{background:var(--line-2)}
.kpi .k{font-size:13px;font-weight:500;color:var(--ink-2)}
.kpi .v{font-size:30px;font-weight:700;line-height:1.05;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi .v small,.big-row .v small{font-size:15px;font-weight:600;color:var(--ink-3);letter-spacing:0}
.kpi .v.na{font-size:17px;color:var(--ink-3);font-weight:600;padding:7px 0}
.kpi .pill{align-self:flex-start}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;padding:4px;background:var(--line-2);border-radius:10px}
.seg button{height:40px;border:0;border-radius:8px;background:transparent;font-size:14px;font-weight:600;color:var(--ink-2);display:flex;align-items:center;justify-content:center;gap:6px}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(15,23,42,.08)}
.seg .n{font-variant-numeric:tabular-nums;font-weight:700}.seg .n.bad{color:var(--bad)}
.cbar{display:flex;align-items:center;gap:12px}
.back{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.thread{display:flex;flex-direction:column;gap:12px;padding:16px}
.msg{display:flex;flex-direction:column;gap:4px;max-width:84%}
.msg.in{align-self:flex-start}.msg.out{align-self:flex-end;align-items:flex-end}
.bub{padding:10px 14px;border-radius:16px;font-size:15px;line-height:1.4;white-space:pre-line;overflow-wrap:anywhere}
.msg.in .bub{background:var(--line-2);border-bottom-left-radius:4px}
.msg.out .bub{background:var(--pri-soft);color:#0b3b7a;border-bottom-right-radius:4px}
.meta{font-size:11px;font-weight:600;color:var(--ink-3);padding:0 6px}
.held{display:flex;align-items:center;gap:8px;padding:12px 16px;background:var(--pri-soft);border-radius:var(--r);color:#0b3b7a;font-weight:600;font-size:14px}
.budget{padding:16px;display:flex;flex-direction:column;gap:12px}
.budget .v{font-size:36px;font-weight:700;letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums}
.budget .v small{font-size:17px;color:var(--ink-3);font-weight:600;letter-spacing:0}
.stack{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--line-2)}
.stack span{display:block;height:100%}
.legend{display:flex;gap:16px;font-size:13px;color:var(--ink-2);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.c1{background:#0b63ce}.c2{background:#7c3aed}.c3{background:#d97706}
.bar{height:6px;border-radius:3px;background:var(--line-2);overflow:hidden;width:100%;display:block}
.bar span{display:block;height:100%;border-radius:3px}
.ord{width:100%;border:0;border-bottom:1px solid var(--line-2);background:var(--card);padding:14px 16px;display:flex;align-items:center;gap:12px;text-align:left;min-height:56px}
.ord:last-child{border-bottom:0}
.num{width:28px;height:28px;border-radius:8px;color:#fff;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ord .nm{flex:1;font-size:15px;font-weight:600}
.ord .val{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
.types{background:var(--bg);border-bottom:1px solid var(--line-2)}
.type{width:100%;border:0;background:transparent;padding:12px 16px 12px 56px;display:flex;align-items:center;gap:12px;text-align:left;min-height:52px;border-top:1px solid var(--line-2)}
.type .nm{flex:1;font-size:14px;font-weight:500}
.type .q{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
.model{margin:0 16px 12px 56px;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:8px;font-size:14px;line-height:1.45;white-space:pre-line}
.chip-row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line-2);min-height:64px}
.chip-row:last-child{border-bottom:0}
.chip-row .mid{gap:6px}
.chip-row .q,.nrow .q{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;width:72px;flex-shrink:0;text-align:right}
.chip-row .q small,.nrow .q small{color:var(--ink-3);font-weight:500}
.stc{width:88px;flex-shrink:0;display:flex;justify-content:flex-end}
.tabs{position:fixed;bottom:0;left:0;right:0;z-index:6;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .in{max-width:430px;margin:0 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.tabs button{height:64px;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;font-weight:600;color:var(--ink-3);position:relative}
.tabs button[aria-current="page"]{color:var(--pri)}
.tabs .badge{position:absolute;top:8px;left:calc(50% + 6px);min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--bad);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid var(--card)}
.scrim{position:fixed;inset:0;z-index:10;background:rgba(15,23,42,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:430px;max-height:88vh;overflow-y:auto;background:var(--card);border-radius:20px 20px 0 0;padding:8px 16px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);align-self:center}
.sheet h3{margin:0;font-size:19px;font-weight:700}
.sh-h{display:flex;align-items:center;justify-content:space-between;gap:12px}
.x{width:44px;height:44px;border-radius:50%;border:0;background:var(--line-2);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.big-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.big-row .v{font-size:44px;font-weight:700;letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums}
.chart{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;align-items:end;height:140px}
.col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%}
.col b{font-size:11px;font-weight:600;color:var(--ink-2);font-variant-numeric:tabular-nums}
.col i{display:block;width:100%;max-width:30px;border-radius:6px 6px 2px 2px;background:#c9d8ee}
.col span{font-size:12px;color:var(--ink-3)}
.col.hoje i{background:var(--pri)}.col.hoje b,.col.hoje span{color:var(--ink);font-weight:700}
.brks{display:flex;flex-direction:column;gap:4px}
.brk{display:grid;grid-template-columns:120px minmax(0,1fr) 48px;align-items:center;gap:12px;min-height:40px}
.brk .bl{font-size:14px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brk .bv{font-size:15px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.brk .bar{height:8px;border-radius:4px}
.numsel{display:flex;align-items:center;gap:8px;height:44px;padding:0 10px;margin-left:-10px;border:0;background:transparent;border-radius:10px;font-size:17px;font-weight:700;max-width:250px;min-width:0}
.numsel .lb{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nlist{display:flex;flex-direction:column;gap:8px}
.nrow{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:8px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card);text-align:left}
.nrow[aria-pressed="true"]{border-color:var(--pri);background:var(--pri-soft)}
.btn{height:52px;border-radius:12px;font-weight:600;font-size:16px;border:1px solid var(--line);background:var(--card);width:100%}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
/* etapa 2: responder, assumir, Pix, catálogo e Perguntar */
.held{justify-content:space-between}
.held button{height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--pri);background:var(--card);color:var(--pri);font-weight:600;font-size:14px}
.compose{display:flex;flex-direction:column;gap:12px;padding:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
.quick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.quick button{height:44px;border-radius:999px;border:1px solid var(--line);background:var(--bg);font-weight:600;font-size:14px;display:flex;align-items:center;justify-content:center;gap:6px}
.quick button.on{background:var(--pri-soft);border-color:var(--pri);color:var(--pri)}
.inrow{display:flex;gap:8px;align-items:flex-end}
.inrow textarea,.askbar textarea{flex:1;min-height:48px;max-height:120px;border:1px solid var(--line);border-radius:24px;padding:13px 16px;font:inherit;font-size:15px;resize:none;color:var(--ink);background:var(--card)}
.inrow textarea:focus,.askbar textarea:focus{outline:2px solid var(--pri);outline-offset:1px;border-color:transparent}
.send{width:48px;height:48px;border-radius:50%;border:0;background:var(--pri);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.send:disabled{opacity:.5}
.warnline{font-size:13px;font-weight:600;color:var(--warn)}
.msg.eu .bub{background:#d9f5e1;color:#0f4d24;border-bottom-right-radius:4px}
.msg.eu.falhou .bub{background:var(--bad-soft);color:var(--bad)}
.msg.ai .bub{background:var(--card);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.me .bub{background:var(--pri);color:#fff;border-bottom-right-radius:4px}
.bub.wait{color:var(--ink-3)}
.msg.ai.falhou .bub{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.msg.ai .btn{height:40px;font-size:14px;width:auto;padding:0 16px}
.intro{display:flex;flex-direction:column;align-items:center;gap:12px;padding:24px 8px 8px;text-align:center}
.intro .ck{width:56px;height:56px;border-radius:50%;background:var(--pri-soft);color:var(--pri);display:flex;align-items:center;justify-content:center}
.intro b{font-size:17px}
.sugs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.sug{min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:14px;font-weight:500}
.notecard{align-self:stretch;border:1px solid var(--line);border-radius:12px;background:var(--card);padding:12px;display:flex;flex-direction:column;gap:12px}
.notecard .txt{font-size:15px;font-weight:600;line-height:1.35}
.btns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.notecard .btn{height:44px;font-size:15px}
.askbar{position:sticky;bottom:calc(72px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;align-items:flex-end;padding:8px 0}
.askbar textarea{box-shadow:0 2px 8px rgba(15,23,42,.06)}
.nota-row .t1 .nm{white-space:normal}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.sheet p{margin:0;font-size:15px;color:var(--ink-2)}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(64px + env(safe-area-inset-top,0px));z-index:12;background:var(--ink);color:#fff;border-radius:999px;padding:10px 18px;font-size:14px;font-weight:500;white-space:nowrap}
/* etapa 3: interruptores */
.sw-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 8px 0 16px;min-height:56px;border-bottom:1px solid var(--line-2)}
.sw-row:last-child{border-bottom:0}
.sw-row span{font-size:15px;font-weight:500}
.sw{width:60px;height:48px;border:0;background:transparent;display:flex;align-items:center;justify-content:center;padding:0;flex-shrink:0}
.sw i{width:48px;height:28px;border-radius:14px;background:#cbd5e1;position:relative;display:block;transition:background .15s}
.sw i::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .15s}
.sw[aria-checked="true"] i{background:#16a34a}.sw[aria-checked="true"] i::after{left:23px}
.sw[aria-disabled="true"] i{opacity:.45}
.lockrow{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--ink-3)}
.chip-row .t1 .pill{height:20px;font-size:11px}
@media (prefers-reduced-motion:reduce){.sw i,.sw i::after{transition:none}}
/* fase 3 (18/11): pendências antigas, vendedor sem responder, busca, Ontem e Resolvido */
.count.warn{background:var(--warn);color:#fff}
.ico.warn{background:var(--warn-soft);color:var(--warn)}
.row .chev{color:var(--ink-3);display:flex}
.find{display:flex;gap:8px;align-items:center}
.find label{position:relative;flex:1;min-width:0;display:flex}
.find label svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--ink-3);pointer-events:none}
.find input{width:100%;height:44px;border:1px solid var(--line);border-radius:22px;padding:0 14px 0 40px;font-size:15px;background:var(--card);color:var(--ink);-webkit-appearance:none;appearance:none}
.find input:focus{outline:2px solid var(--pri);outline-offset:1px;border-color:transparent}
.seg.dia{grid-template-columns:repeat(2,minmax(0,1fr));width:136px;flex-shrink:0}
.seg.dia button{height:36px;font-size:13px}
.seg.quatro{grid-template-columns:repeat(4,minmax(0,1fr))}
.seg.quatro button{font-size:13px;gap:4px;padding:0 2px;white-space:nowrap}
@media (max-width:370px){.seg.quatro .n{display:none}.seg.quatro button{font-size:12px}.seg.dia{width:116px}}
.divider{padding:10px 16px;background:var(--bg);border-bottom:1px solid var(--line-2);font-size:12px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em;scroll-margin-top:72px}
.found{font-size:13px;color:var(--ink-3);padding:0 4px}
.why{display:flex;flex-direction:column;gap:10px;padding:14px 16px;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--bad);border-radius:var(--r)}
.why .t{font-size:15px;line-height:1.4;overflow-wrap:anywhere}
.why .t b{color:var(--bad)}
.why .s{font-size:13px;color:var(--ink-3)}
.why .btn{height:48px;display:flex;align-items:center;justify-content:center;gap:8px}
.btn.okb{background:var(--ok);border-color:var(--ok);color:#fff}
#filtros:empty{display:none}
#lista{display:flex;flex-direction:column;gap:12px}
.note{display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:var(--r);background:var(--warn-soft);color:var(--warn);font-size:14px;font-weight:600}
.dia-tag{font-size:12px;font-weight:600;color:var(--ink-3)}
/* fase B (19/11): situação por cor, ficha do cliente, resultado do envio e marcar */
.fhead{display:flex;align-items:center;justify-content:space-between}
.help{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink-3);font-size:14px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.filt{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.filt button{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:64px}
.filt .n{font-size:22px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.filt .l{font-size:12px;font-weight:600;color:var(--ink-2);display:flex;align-items:center;gap:4px;white-space:nowrap}
.filt button[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.filt .bad .n{color:var(--bad)}.filt .warn .n{color:var(--warn)}.filt .ok .n{color:var(--ok)}
@media (max-width:370px){.filt .l{font-size:11px}.filt .l .dot{display:none}}
.t2.pv{display:flex;align-items:center;gap:4px}.t2.pv span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t3{font-size:12px;color:var(--ink-3);display:flex;align-items:center;gap:6px;min-width:0}
.t3 span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.quem{font-size:11px;font-weight:600;color:var(--ink-2);display:inline-flex;align-items:center;gap:3px;white-space:nowrap}
.stbtn{border:0;background:transparent;padding:4px 0;display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex-shrink:0}
.ficha .fh{display:flex;align-items:center;justify-content:space-between;width:100%;border:0;background:var(--card);padding:10px 16px;font-weight:600;font-size:14px;min-height:44px}
.ficha .fh svg{transition:transform .15s}.ficha .fh[aria-expanded="false"] svg{transform:rotate(-90deg)}
.fl{display:grid;grid-template-columns:84px minmax(0,1fr);gap:10px;padding:2px 16px 14px;font-size:14px;align-items:center}
.fl .k{color:var(--ink-3);font-size:13px}
.fl .v{display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-width:0;font-variant-numeric:tabular-nums}
.fl .vazio{grid-column:1/-1;color:var(--ink-3)}
.mini{height:32px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:5px;color:var(--pri);text-decoration:none}
.est{font-size:12px;font-weight:600;display:flex;align-items:center;gap:4px;padding:0 6px;flex-wrap:wrap}
.est.ok{color:var(--ok)}.est.bad{color:var(--bad)}
.retry{border:0;background:transparent;color:var(--pri);font-weight:700;font-size:12px;padding:6px 0 6px 6px}
.midia{display:inline-flex;align-items:center;gap:6px;color:var(--ink-2)}
.quick.q4{grid-template-columns:repeat(4,minmax(0,1fr))}
.quick.q4 button{font-size:13px;gap:4px;padding:0 2px}
@media (max-width:400px){.quick.q4 button svg{display:none}}
.opt{display:flex;align-items:center;gap:12px;width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card);text-align:left;min-height:56px}
.opt[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.opt .ot b{display:block;font-size:15px}.opt .ot span{display:block;font-size:13px;color:var(--ink-2)}
.cdot{width:16px;height:16px;border-radius:50%;flex-shrink:0}
.cdot.bad{background:#dc2626}.cdot.warn{background:#d4a011}.cdot.ok{background:#22a447}.cdot.mute{background:#94a3b8}
.legenda{display:flex;flex-direction:column;gap:10px;font-size:15px;line-height:1.4}
.legenda div{display:flex;gap:10px;align-items:flex-start}.legenda .cdot{margin-top:3px}
.btn:disabled{opacity:.5}
.dsep{align-self:center;font-size:12px;font-weight:600;color:var(--ink-3);background:var(--line-2);padding:3px 10px;border-radius:999px}
.why.neutro{border-left-color:var(--ink-3)}.why.neutro .t b{color:var(--ink)}
.quem.alerta{color:var(--ink);font-weight:700}
/* entrar */
.login{min-height:100vh;display:flex;flex-direction:column;justify-content:center;gap:16px;padding:24px max(16px,env(safe-area-inset-left,0px))}
.login h1{margin:0;font-size:24px;font-weight:700}
.login label{font-size:14px;font-weight:600;color:var(--ink-2)}
.login input{height:52px;border:1px solid var(--line);border-radius:12px;padding:0 16px;font-size:16px;background:var(--card);width:100%}
.login input:focus{outline:2px solid var(--pri);outline-offset:1px;border-color:transparent}
.campo{display:flex;flex-direction:column;gap:6px}
.erro{color:var(--bad);font-size:14px;font-weight:600}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
</style>

<script>
(function(){

var IC={

  lock:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 11h14v10h-14z"/><path d="M8 11v-4a4 4 0 1 1 8 0v4"/></svg>',
  pix:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l9 9l-9 9l-9-9z"/></svg>',
  list:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6h11"/><path d="M9 12h11"/><path d="M9 18h11"/><path d="M5 6v.01"/><path d="M5 12v.01"/><path d="M5 18v.01"/></svg>',
  ask:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18a9 9 0 0 0 0-18z"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6v.6"/><path d="M12 17h.01"/></svg>',
  hand:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 13v-7.5a1.5 1.5 0 0 1 3 0v6.5"/><path d="M11 5.5v-2a1.5 1.5 0 1 1 3 0v8.5"/><path d="M14 5.5a1.5 1.5 0 0 1 3 0v6.5"/><path d="M17 7.5a1.5 1.5 0 0 1 3 0v8.5a6 6 0 0 1-6 6h-2a7 6 0 0 1-5-3l-2.7-5.3a1.5 1.5 0 0 1 2.6-1.4l1.1 1.7"/></svg>',
  search:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3a7 7 0 1 0 0 14a7 7 0 0 0 0-14z"/><path d="M21 21l-6-6"/></svg>',
  clock:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18a9 9 0 0 0 0-18z"/><path d="M12 7v5l3 3"/></svg>',
  ok:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5l10-10"/></svg>',
  ok14:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5l10-10"/></svg>',
  x14:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" aria-hidden="true"><path d="M18 6l-12 12"/><path d="M6 6l12 12"/></svg>',
  alerta14:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 9v4"/><path d="M12 17h.01"/><path d="M10.3 3.9l-8.1 14a2 2 0 0 0 1.7 3h16.2a2 2 0 0 0 1.7-3l-8.1-14a2 2 0 0 0-3.4 0z"/></svg>',

  file:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3v4a1 1 0 0 0 1 1h4"/><path d="M17 21h-10a2 2 0 0 1-2-2v-14a2 2 0 0 1 2-2h7l5 5v11a2 2 0 0 1-2 2z"/></svg>'
};
var ST={ok:['Ok','ok'],limite:['No limite','warn'],caiu:['Caiu','bad'],restrito:['Restrito','bad'],desligado:['Desligado','mute']};
var ORDENS=[{n:1,nome:'Rotina',cls:'c1',cor:'#0b63ce'},{n:2,nome:'Vendas',cls:'c2',cor:'#7c3aed'},{n:3,nome:'Cobrança',cls:'c3',cor:'#d97706'}];
var DIAS=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];

function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function ini(n){return String(n||'?').split(/\s+/).filter(Boolean).map(function(p){return p[0];}).join('').slice(0,2).toUpperCase();}
function pct(a,b){return b?Math.round(a/b*100):null;}
function pill(t,tone){return '<span class="pill '+tone+'">'+esc(t)+'</span>';}
function minAtras(iso){var t=Date.parse(iso);return isNaN(t)?null:Math.max(0,Math.round((Date.now()-t)/60000));}
function tempo(m){return m==null?'':m<60?m+' min':Math.floor(m/60)+' h';}
function hhmm(iso){var d=new Date(iso);return isNaN(d)?'':String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
function ddmm(iso){var d=new Date(iso);return isNaN(d)?'':String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0');}
function ehHoje(iso){var d=new Date(iso),h=new Date();return !isNaN(d)&&d.toDateString()===h.toDateString();}
function normaliza(s){return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();}

var SB=null, D=null, EM=null, ERRO='', TIMER=null, PAPEL='';
var DO=null, DO_EM=0, DO_ERRO='', DO_LENDO=false; /* (fase 3) conversas de ontem: linha à parte, lida só quando a pessoa toca em Ontem */
var S={tab:'agora',conv:null,filtro:'todas',ord:null,tipo:null,num:null,sheet:null,entrando:false,loginErro:'',
  draft:'',ask:'',saidas:{},chat:[],notas:[],iaSeg:'chat',toast:'',modal:null,assumeLocal:{},
  dia:'hoje',busca:'',resolvLocal:{},
  marcaLocal:{},marcar:null,info:null,ficha:true,hist:{}}; /* (19/11, fases B e D) marca feita aqui (vale na hora), folha de marcar, folha das cores, ficha aberta e histórico */
var PEND={}; /* ordens esperando o servidor: id -> {f, desde, ate} (18/11: cada ordem com o próprio prazo) */
/* (18/11) falhas da tela (sem internet, login vencido) vão junto da próxima ordem que chegar, para o log do servidor;
   sugestão de anotação descartada não volta quando a conversa é recarregada */
var FALHAS=[], DESC=[];
try{FALHAS=JSON.parse(localStorage.getItem('app-falhas')||'[]')||[];DESC=JSON.parse(localStorage.getItem('app-notas-descartadas')||'[]')||[];}catch(e){FALHAS=[];DESC=[];}

/* ---------- dados derivados (o pacote vem pronto do servidor) ---------- */
function chips(){return (D&&D.chips)||[];}
function doChip(L){return (L||[]).filter(function(c){return !S.num||c.chip===S.num;});}
/* (19/11, fase D) com o tempo real ligado, as conversas do dia vêm da tabela app_conversas (o celular recebe cada mudança na hora);
   sem ele (tabela ainda não criada, canal caído), do pacote de 1 em 1 min, como antes */
var RT={convs:null,canal:null,vivo:false,dia:''};
function convsDoDia(){return RT.convs&&RT.vivo?Object.keys(RT.convs).map(function(k){return RT.convs[k];}):(D&&D.convs)||[];}
function convs(){return doChip(convsDoDia());} /* as do dia e, desde a fase 3, as antigas (quem espera o Leonardo desde outro dia) */
function hojeC(){return convs().filter(function(c){return !c.antiga;});}
/* (fase 3) Resolvido some da tela na hora; se o servidor confirmar e o pacote ainda não mostrar, espera até 20 min (sincronismo e Ontem) */
function resolvida(c){var t=S.resolvLocal[c.id];return !!t&&Date.now()-t<1200000;}
function querem(){return hojeC().filter(function(c){return c.quer&&!resolvida(c);});}
function antigas(){return convs().filter(function(c){return c.antiga&&c.quer&&!resolvida(c);}).sort(function(a,b){return String(b.desde||b.quando).localeCompare(String(a.desde||a.quando));});}
function esperamVendedor(){return hojeC().filter(function(c){var m=minAtras(c.semResp);return c.vend&&m!=null&&m>=60;}).sort(function(a,b){return String(a.semResp).localeCompare(String(b.semResp));});}
function ultCli(c){var u=(c.msgs||[]).filter(function(m){return m.de==='cli';}).slice(-1)[0];return u?String(u.t).replace(/\n/g,' '):(c.motivo||'');}
function sel(){
  var L=chips().filter(function(c){return !S.num||c.nome===S.num;}), t={env:0,teto:0,resp:0};
  L.forEach(function(c){t.env+=c.env;t.teto+=c.teto;t.resp+=c.resp;});
  var C=hojeC(); t.conv=C.length; t.res=C.filter(function(c){return !c.quer;}).length; return t;
}
function tiposSel(){
  return ((D&&D.tipos)||[]).map(function(t){
    if(!S.num) return t;
    var p=t.porChip[S.num]||{env:0,resp:0}; return Object.assign({},t,{env:p.env,resp:p.resp});
  }).filter(function(t){return t.env>0;});
}
function pendencias(){
  var it=[], caidos=chips().filter(function(c){return (c.st==='caiu'||c.st==='restrito')&&(!S.num||c.nome===S.num);});
  if(caidos.length) it.push({tipo:'falha',titulo:caidos.length>1?caidos.length+' chips fora do ar':'Chip '+caidos[0].nome+(caidos[0].st==='restrito'?' restrito':' caiu'),sub:caidos.map(function(c){return c.nome;}).join(' · '),acao:caidos.some(function(c){return c.st==='caiu';})?'Ler QR':'Restrito'});
  querem().slice().sort(function(a,b){return String(a.quando).localeCompare(String(b.quando));}).forEach(function(c){
    it.push({tipo:'cliente',id:c.id,nome:c.nome,chip:c.chip,sub:ultCli(c),min:minAtras(c.quando)});
  });
  return it;
}
function alarme(){return querem().filter(function(c){var m=minAtras(c.quando);return m!=null&&m<=60;}).length;}
function ontemSemana(){ /* o mesmo dia da semana passada, quando o histórico tem */
  if(!D||!D.hist||!D.dia) return null; var d=new Date(D.dia+'T12:00:00'); d.setDate(d.getDate()-7);
  var k=d.toISOString().slice(0,10); return D.hist.filter(function(h){return h.dia===k;})[0]||null;
}
function kpis(){
  var s=sel(), sp=S.num?null:ontemSemana(), r=pct(s.resp,s.env), rb=pct(s.res,s.conv);
  function dl(atual,antes,u){return (atual==null||antes==null)?null:{d:u==='%'?(antes?Math.round((atual-antes)/antes*100):null):atual-antes,u:u};}
  return [
    {id:'env',k:'Enviadas',n:s.env,v:String(s.env),dl:sp?dl(s.env,sp.env,'%'):null},
    {id:'resp',k:'Respostas',n:r,v:r==null?null:r+'<small>%</small>',dl:sp?dl(r,sp.resp,' pts'):null},
    {id:'robo',k:'Robô resolveu',n:rb,v:rb==null?null:rb+'<small>%</small>',dl:sp?dl(rb,sp.robo,' pts'):null},
    {id:'pix',k:'Pix pagos',n:null,v:null,dl:null}
  ];
}
function delta(x){if(!x||x.d==null)return '';if(x.u===' pts'&&Math.abs(x.d)===1)x={d:x.d,u:' pt'};return x.d>0?pill('▲ '+x.d+x.u,'ok'):x.d<0?pill('▼ '+Math.abs(x.d)+x.u,'bad'):pill('Igual','mute');}

/* ---------- AGORA ---------- */
function vAgora(){
  var p=pendencias(), top=p.slice(0,5), resto=p.length-top.length, a=alarme(), ant=antigas(), ev=esperamVendedor(), h='';
  if(a>10) h+='<button class="alarm" data-act="ver-querem"><span class="big">'+a+'</span><span class="lbl"><b>Pediram pessoa</b><span>última hora · robô pode estar errando</span></span>'+IC.chev+'</button>';
  h+='<section class="sec"><div class="sec-h"><h2>Precisa de você</h2><span class="count '+(p.length?'bad':'ok')+'">'+p.length+'</span></div><div class="card">';
  if(!p.length) h+='<div class="empty"><div class="ck">'+IC.check+'</div><b>'+(ant.length?'Nada novo hoje':'Tudo em dia')+'</b>'+(ant.length?'':'<span>0 pendências</span>')+'</div>';
  top.forEach(function(x){
    if(x.tipo==='falha') h+='<div class="row"><div class="ico bad">'+IC.wifi+'</div><div class="mid"><div class="t1"><span class="nm">'+esc(x.titulo)+'</span></div><div class="t2">'+esc(x.sub)+'</div></div><div class="end">'+pill(x.acao,'bad')+'</div></div>';
    else h+='<button class="row" data-act="abrir" data-id="'+esc(x.id)+'"><div class="ico bad">'+esc(ini(x.nome))+'</div><div class="mid"><div class="t1"><span class="nm">'+esc(x.nome)+'</span><span class="tag">'+esc(x.chip)+'</span></div><div class="t2">'+esc(x.sub)+'</div></div><div class="end"><span class="time">'+tempo(x.min)+'</span>'+pill('Quer pessoa','bad')+'</div></button>';
  });
  if(resto>0) h+='<button class="more" data-act="ver-querem">Ver mais '+resto+'</button>';

/* ---------- CONVERSAS ---------- */
function assumida(c){return S.assumeLocal[c.id]!==undefined?S.assumeLocal[c.id]:!!c.assumido;}
/* (19/11, fase B; regra do Gestor) a COR é só a marca que o Leonardo ou o pai põem à mão: Caso sério, Resolvendo ou Resolvido. Nada troca
   a cor sozinho; conversa sem marca fica cinza ("Sem marca"). Ao lado vai o que o sistema sabe (quem), só como texto; os alertas
   (Precisa de você, Sem dono, Envio não saiu) ganham destaque sem cor. A marca feita aqui vale na hora (marcaLocal) até o pacote confirmar.
   Pacote antigo (sem quem): a tela deduz o texto do que ele tem */
var COR={vermelho:['Caso sério','bad'],amarelo:['Resolvendo','warn'],verde:['Resolvido','ok']}, SEM=['Sem marca','mute'];
function corServidor(c,semMarca){
  var r={cor:'',quem:c.quem||(assumida(c)?'Assumida':c.quer?'Precisa de você':c.vend?'Vendedor':'Robô'),porque:c.porque||(c.quer?c.motivo||'':''),
    desde:c.porqueDesde||(c.quer?c.desde||'':''),alerta:c.alerta!=null?!!c.alerta:!!c.quer,manual:false};
  if(!semMarca&&c.manual&&COR[c.cor]){r.cor=c.cor;r.manual=true;r.marcaPor=c.marcaPor||'';r.marcaEm=c.marcaEm||'';}
  return r;
}
function corDe(c){
  var ml=S.marcaLocal[c.id];
  if(!(ml&&Date.now()-ml.t<1200000)) return corServidor(c);
  var r=corServidor(c,true); if(ml.cor){r.cor=ml.cor;r.manual=true;r.marcaPor=PAPEL==='familia'?'Pai':'Leonardo';r.marcaEm=new Date(ml.t).toISOString();}
  return r;
}
function tom(e){return e.cor?COR[e.cor]:SEM;}
/* ordem da lista: Caso sério, sem marca (as com alerta primeiro), Resolvendo, Resolvido; dentro de cada uma, a mais recente primeiro */
function ordemCor(a,b){var P={vermelho:0,'':1,amarelo:2,verde:3},ea=corDe(a),eb=corDe(b);
  if(P[ea.cor]!==P[eb.cor]) return P[ea.cor]-P[eb.cor];
  if(!ea.cor&&ea.alerta!==eb.alerta) return ea.alerta?-1:1;
  return String(b.quando).localeCompare(String(a.quando));}
/* (fase 3) Hoje ou Ontem e busca (procura em todas, sem filtro). A busca só redesenha a lista, não a tela inteira:
   o teclado do celular não fecha a cada letra. (19/11) busca também por código, final do telefone, rota e bairro */
function listaDia(){return S.dia==='ontem'?doChip(DO&&DO.convs):convs();}
function previa(c){

  if(m.tipo==='imagem') return IC.img+'<span>'+quem+'Foto</span>';

}

/* (18/11) motivo curto e verdadeiro da falha (antes era sempre "Sem permissão ou sem conexão") e registro para o log do servidor */
function motivoCurto(e){var t=String((e&&e.message)||e||'');
  return /fetch|network|internet|load failed|offline/i.test(t)?'sem internet':/jwt|token|expired|401|sess/i.test(t)?'login vencido: saia e entre de novo':/row-level|permission|42501|403/i.test(t)?'sem permissão':t.slice(0,60)||'erro desconhecido';}
function anotaFalha(onde,e){FALHAS.push({quando:new Date().toISOString(),onde:onde,motivo:String((e&&e.message)||e||'').slice(0,160)});FALHAS=FALHAS.slice(-10);
  try{localStorage.setItem('app-falhas',JSON.stringify(FALHAS));}catch(x){}}
async function ordem(tipo,dados){

  var d={tipo:tipo,dados:dados,status:'pendente',criadoEm:agora,por:EM}, levar=FALHAS.slice(0,5); if(levar.length) d.falhasTela=levar;

/* (etapa 3) interruptores: só o Leonardo (papel admin); a tela mostra o novo estado na hora e volta atrás se o servidor recusar */
S.swLocal={};
function ligadaChave(k){return S.swLocal['k:'+k.nome]!==undefined?S.swLocal['k:'+k.nome]:!!k.ligada;}
function ligadoEnvio(c){return S.swLocal['c:'+c.conta]!==undefined?S.swLocal['c:'+c.conta]:!!c.envio;}
async function trocarSw(chaveLocal,tipo,dados,ligar,rotulo){

  try{var id=await ordem(tipo,dados);acompanha(id,function(d){if(d.status!=='feito'){delete S.swLocal[chaveLocal];toast('Não deu: '+(d.resultado||''));}else toast(rotulo+(ligar?' ligado':' desligado'));});}
  catch(e){anotaFalha('interruptor',e);delete S.swLocal[chaveLocal];toast('Não saiu: '+motivoCurto(e));}

/* (18/11) cada ordem tem o próprio prazo (antes o prazo de ~2,5 min era da fila toda e a resposta que chegava depois sumia).
   Olha a cada 1 s no primeiro minuto e depois a cada 4 s, por até 10 min; sem resposta nesse tempo: "sem confirmação" */
function acompanha(id,aoTerminar,limiteSeg){PEND[id]={f:aoTerminar,desde:Date.now(),ate:Date.now()+(limiteSeg||600)*1000};vigiaOrdens();}
async function vigiaOrdens(){
  if(vigiaOrdens.on) return; vigiaOrdens.on=true;
  try{
    while(Object.keys(PEND).length){
      var novo=Object.keys(PEND).some(function(k){return Date.now()-PEND[k].desde<60000;});
      await new Promise(function(r){setTimeout(r,novo?1000:4000);});
      var ids=Object.keys(PEND); if(!ids.length) break;
      var r; try{r=await SB.from('painel_dados').select('id,dados').in('id',ids);}catch(e){r={};}
      (r.data||[]).forEach(function(o){var d=o.dados||{},p=PEND[o.id];if(p&&d.status&&d.status!=='pendente'){delete PEND[o.id];try{p.f(d);}catch(e){}}});
      Object.keys(PEND).forEach(function(k){var p=PEND[k];if(Date.now()>p.ate){delete PEND[k];try{p.f({status:'sem_confirmacao',resultado:'o servidor não confirmou em 10 min'});}catch(e){}}});
      S.chat.forEach(function(m){if(m.esperando&&m.t0&&Date.now()-m.t0>45000)m.demorando=true;});
      render();
    }
  }finally{vigiaOrdens.on=false;render();}
}

  (S.saidas[c]=S.saidas[c]||[]).push(s); if(tipo==='responder') S.draft=''; render();
  try{var id=await ordem(tipo,tipo==='responder'?{conv:c,texto:texto}:{conv:c});acompanha(id,function(d){s.st=d.status;s.erro=d.resultado;});}

/* (19/11, fase B) marcar: a cor muda na hora e volta se o servidor recusar. Resolvido (verde) também fecha as pendências e tira de
   "Precisa de você" (antes era a ordem 'resolver', só do Leonardo; agora o pai também). Banco sem a regra 0008: o aviso diz o que falta */
async function marcarConv(c,cor){
  S.marcaLocal[c.id]={cor:cor,t:Date.now()}; if(cor==='verde') S.resolvLocal[c.id]=Date.now(); S.marcar=null; S.modal=null; render();
  function volta(){delete S.marcaLocal[c.id]; if(cor==='verde') delete S.resolvLocal[c.id];}

  catch(e){anotaFalha('marcar',e);volta();toast(/row-level|42501/i.test(String((e&&e.message)||e))?'Não saiu: falta liberar no banco (SQL 0008)':'Não saiu: '+motivoCurto(e));}
}
/* a marca local sai quando nenhum pacote (hoje ou ontem) mostra mais a conversa querendo pessoa */
function limpaResolv(){Object.keys(S.resolvLocal).forEach(function(id){if(!convsDoDia().concat((DO&&DO.convs)||[]).some(function(x){return x.id===id&&x.quer;}))delete S.resolvLocal[id];});}
/* (19/11) marca local sai quando o pacote confirma (ou em 20 min); resposta do app que o pacote já mostra (com o resultado do robô) sai
   da lista local de envios ("Na fila do chip" some e fica a fala com Enviado ou Não saiu) */
function limpaLocais(){
  var todas=convsDoDia().concat((DO&&DO.convs)||[]), acha=function(id){return todas.filter(function(x){return x.id===id;})[0];};
  Object.keys(S.marcaLocal).forEach(function(id){var c=acha(id),ml=S.marcaLocal[id];
    if(!c||Date.now()-ml.t>1200000||(ml.cor?(c.manual&&c.cor===ml.cor):!c.manual)) delete S.marcaLocal[id];});
  Object.keys(S.saidas).forEach(function(id){var c=acha(id),n=c?(c.msgs||[]).filter(function(m){return m.de==='app';}).length:0;
    S.saidas[id]=S.saidas[id].filter(function(s){if(s.st!=='feito') return true; if(Date.now()-(s.t0||0)>600000) return false; if(c&&n>s.base){n--;return false;} return true;});});
}
/* (19/11, fase D) tempo real: lê as conversas de hoje da tabela app_conversas e assina as mudanças (Realtime). Sem a tabela (SQL 0009 ainda
   não rodado) ou com o canal caído, a tela segue com o pacote de 1 em 1 min. Ao (re)conectar, relê a tabela; na virada do dia, recomeça */
async function lerRT(dia){var r;try{r=await SB.from('app_conversas').select('id,dados').eq('dia',dia);}catch(e){r={error:e};}
  if(r.error||!r.data) return null; var m={}; r.data.forEach(function(x){m[x.id]=x.dados;}); return m;}
async function iniciarTempoReal(dia){
  if(!SB||typeof SB.channel!=='function'||!dia||(RT.canal&&RT.dia===dia)||RT.iniciando) return;
  if(RT.canal){try{SB.removeChannel(RT.canal);}catch(e){} RT={convs:null,canal:null,vivo:false,dia:''};}
  RT.iniciando=true; var m=await lerRT(dia); RT.iniciando=false;
  if(!m) return; /* tabela ainda não existe ou sem acesso: fica no pacote */
  RT.convs=m; RT.dia=dia;
  var muda=function(p){if(p.eventType==='DELETE'){if(p.old&&p.old.id) delete RT.convs[p.old.id];}else if(p.new&&p.new.id&&p.new.dia===RT.dia) RT.convs[p.new.id]=p.new.dados; limpaLocais(); render();};
  RT.canal=SB.channel('app-conversas-'+dia)
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'app_conversas',filter:'dia=eq.'+dia},muda)
    .on('postgres_changes',{event:'UPDATE',schema:'public',table:'app_conversas',filter:'dia=eq.'+dia},muda)
    .on('postgres_changes',{event:'DELETE',schema:'public',table:'app_conversas'},muda) /* apagar não aceita filtro: chega só a chave */
    .subscribe(function(st){var v=st==='SUBSCRIBED'; if(v===RT.vivo) return; RT.vivo=v; render();
      if(v) lerRT(RT.dia).then(function(m2){if(m2){RT.convs=m2;limpaLocais();render();}});});
}
/* (19/11, fase D) histórico: ao abrir a conversa, as falas dos dias anteriores (app_mensagens, 90 dias). Sem a tabela, nada aparece */
function diaBR(iso){return new Date(iso).toLocaleDateString('sv-SE',{timeZone:'America/Sao_Paulo'});}

async function buscarOntem(forcar){

/* (18/11) a sugestão de anotação fica até a pessoa tocar (antes sumia na mensagem seguinte: 4 das 5 do pai se perderam em 17/11);
   resposta com falha não vai no histórico mandado à IA e ganha "Tentar de novo"; espera longa libera a caixa depois de 45 s */
function ocupado(){return S.chat.some(function(m){return m.esperando&&!m.demorando;});}
function acompanhaPergunta(m,id){
  m.id=id; m.t0=m.t0||Date.now();
  acompanha(id,function(d){m.esperando=false;m.demorando=false;
    if(d.status==='feito'){m.content=d.resposta||'…';if(d.anotar&&!notaJaSalva(d.anotar))m.nota=d.anotar;}
    else{m.falhou=true;m.content=d.status==='sem_confirmacao'?'O servidor não respondeu em 10 min.':'Não consegui responder agora: '+(d.resultado||'tente de novo');}
    setTimeout(rolaFim,50);});
}
async function perguntar(txt){

  S.chat.push({role:'user',content:txt}); var m={role:'assistant',content:'',esperando:true,pergunta:txt,t0:Date.now()}; S.chat.push(m); S.ask=''; render(); rolaFim();
  try{acompanhaPergunta(m,await ordem('pergunta',{texto:txt,hist:hist}));}
  catch(e){anotaFalha('pergunta',e);m.esperando=false;m.falhou=true;m.content='Não chegou ao servidor ('+motivoCurto(e)+').';render();}
}

function rolaFim(){var t=document.querySelector('.askbar');if(t)t.scrollIntoView({block:'end'});}
async function carregarNotas(){

  if(!r.error){S.notas=(r.data||[]).map(function(x){return x.dados;});render();}

function notaJaSalva(a){return S.notas.some(function(n){return n&&n.resumo===a.resumo;});}
/* (18/11) a conversa da aba Perguntar volta ao abrir o app: as perguntas da própria pessoa nas últimas 24 h, lidas das ordens
   (a regra do banco deixa cada um ler as suas); a que ainda está pendente volta a ser acompanhada */
async function carregarChat(){
  if(S.chat.length||!EM) return;
  var r; try{r=await SB.from('painel_dados').select('id,dados').like('id','app-cmd-%').filter('dados->>tipo','eq','pergunta').filter('dados->>por','eq',EM).order('id',{ascending:false}).limit(8);}catch(e){return;}
  if(!r||r.error||!r.data||S.chat.length) return;
  var desde=Date.now()-24*3600e3;
  r.data.filter(function(o){var t=Date.parse((o.dados||{}).criadoEm);return !isNaN(t)&&t>=desde;}).reverse().forEach(function(o){
    var d=o.dados||{},x=d.dados||{},m={role:'assistant',content:'',pergunta:String(x.texto||''),id:o.id};
    S.chat.push({role:'user',content:m.pergunta});
    if(d.status==='feito'){m.content=d.resposta||'…';if(d.anotar&&!notaJaSalva(d.anotar)&&DESC.indexOf(o.id)<0)m.nota=d.anotar;}
    else if(d.status==='pendente'){m.esperando=true;m.t0=Date.parse(d.criadoEm)||Date.now();acompanhaPergunta(m,o.id);}
    else{m.falhou=true;m.content='Não consegui responder: '+(d.resultado||d.status);}
    S.chat.push(m);});
  render();
}
async function salvarNota(i){
  var m=S.chat[i]; if(!m||!m.nota) return; m.notaFeita='sim'; render();
  var agora=new Date().toISOString(), o={tipo:m.nota.tipo,resumo:m.nota.resumo,papel:PAPEL==='familia'?'Pai':'Leonardo',quando:agora,status:'nova',por:EM};
  var r; try{r=await SB.from('painel_dados').insert({id:'app-nota-'+Date.now()+'-'+Math.random().toString(36).slice(2,6),dados:o,atualizado_em:agora});}catch(e){r={error:e};}
  if(r.error){anotaFalha('anotação',r.error);m.notaFeita=null;toast('Não salvou ('+motivoCurto(r.error)+'). Tente de novo.');return;}
  toast('Anotado'); carregarNotas();
}

/* ---------- FOLHAS ---------- */
function brk(l,v,max,cor,suf){return '<div class="brk"><span class="bl">'+esc(l)+'</span><span class="bar"><span style="width:'+(max?Math.min(100,v/max*100):0)+'%;background:'+cor+'"></span></span><span class="bv">'+v+(suf||'')+'</span></div>';}
function vSheetKpi(id){
  var K=kpis().filter(function(x){return x.id===id;})[0], s=sel(), ehPct=id==='resp'||id==='robo';
  var h='<div class="sh-h"><h3>'+K.k+'</h3><button class="x" data-act="fechar" aria-label="Fechar">'+IC.x+'</button></div>';
  h+='<div class="big-row">'+(K.v==null?'<span class="v" style="font-size:24px;color:var(--ink-3)">Sem leitura</span>':'<span class="v">'+K.v+'</span>')+delta(K.dl)+'</div>';
  if(id==='pix') return h+'<p class="sub-h">Ainda não medido</p>';
  if(!S.num&&D.hist&&D.hist.length){
    var campo={env:'env',resp:'resp',robo:'robo'}[id], H=D.hist.slice(-7), /* o 8º dia guardado só serve para comparar */ vals=H.map(function(x){return x[campo];});
    var mx=Math.max.apply(null,vals.map(function(v){return v||0;}))||1;
    h+='<p class="sub-h">7 dias</p><div class="chart" style="grid-template-columns:repeat('+H.length+',minmax(0,1fr))">';
    H.forEach(function(x,i){var v=vals[i], hj=x.dia===D.dia;h+='<div class="col'+(hj?' hoje':'')+'"><b>'+(v==null?'':v+(ehPct?'%':''))+'</b><i style="height:'+(v==null?2:Math.max(4,Math.round(v/mx*96)))+'px"></i><span>'+(hj?'Hoje':DIAS[new Date(x.dia+'T12:00:00').getDay()])+'</span></div>';});
    h+='</div>';
  }
  var rows='', tit='';
  if(id==='env'){
    if(!S.num){tit='Por chip';var m=Math.max.apply(null,chips().map(function(c){return c.env;}))||1;chips().forEach(function(c){rows+=brk(c.nome,c.env,m,c.env?'#0b63ce':'#94a3b8');});}
    else{tit='Por tipo';var T=tiposSel(),m2=Math.max.apply(null,T.map(function(t){return t.env;}))||1;T.forEach(function(t){rows+=brk(t.nome,t.env,m2,'#0b63ce');});}
  }else if(id==='resp'){
    tit='Por tipo';tiposSel().forEach(function(t){var p=pct(t.resp,t.env)||0;rows+=brk(t.nome,p,100,p>=20?'#16a34a':p>=10?'#d4a011':'#dc2626','%');});
  }else{
    tit='Conversas';rows+=brk('Sozinho',s.res,s.conv,'#16a34a')+brk('Quer pessoa',s.conv-s.res,s.conv,'#dc2626');
  }
  if(rows) h+='<p class="sub-h">'+tit+'</p><div class="brks">'+rows+'</div>';
  return h;
}
function vSheetNum(){
  var C=chips(), pior=C.some(function(c){return ST[c.st]&&ST[c.st][1]==='bad';})?'bad':C.some(function(c){return c.st==='limite';})?'warn':'ok';
  var salvo=S.num; S.num=null; var t=sel(); S.num=salvo;
  var h='<div class="sh-h"><h3>Número</h3><button class="x" data-act="fechar" aria-label="Fechar">'+IC.x+'</button></div><div class="nlist">';
  h+='<button class="nrow" data-act="pick-num" data-id="" aria-pressed="'+(!S.num)+'"><span class="dot '+pior+'"></span><div class="mid"><div class="t1"><span class="nm">Todos</span></div></div><span class="q">'+t.env+' <small>/ '+t.teto+'</small></span><span class="stc"></span></button>';
  C.forEach(function(c){
    var st=ST[c.st]||ST.ok, q=((D&&D.convs)||[]).filter(function(x){return x.chip===c.nome&&x.quer&&!x.antiga&&!resolvida(x);}).length;
    h+='<button class="nrow" data-act="pick-num" data-id="'+esc(c.nome)+'" aria-pressed="'+(S.num===c.nome)+'"><span class="dot '+st[1]+'"></span><div class="mid"><div class="t1"><span class="nm">'+esc(c.nome)+'</span>'+(q?'<span class="count bad">'+q+'</span>':'')+'</div></div><span class="q">'+c.env+' <small>/ '+c.teto+'</small></span><span class="stc">'+pill(st[0],st[1])+'</span></button>';
  });
  h+='</div><button class="btn" data-act="sair">Sair</button>';
  return h;
}

/* ---------- MOLDURA ---------- */
function vLogin(){
  return '<form class="login" id="fLogin"><h1>Aliança WhatsApp</h1>'+
    '<div class="campo"><label for="em">E-mail</label><input id="em" type="email" autocomplete="username" required></div>'+
    '<div class="campo"><label for="se">Senha</label><input id="se" type="password" autocomplete="current-password" required></div>'+
    (S.loginErro?'<span class="erro">'+esc(S.loginErro)+'</span>':'')+
    '<button class="btn pri" type="submit"'+(S.entrando?' disabled':'')+'>'+(S.entrando?'Entrando…':'Entrar')+'</button></form>';
}
function render(){
  var app=document.getElementById('app');
  if(!EM){app.innerHTML=vLogin();var f=document.getElementById('fLogin');f.addEventListener('submit',entrar);return;}
  if(!D){app.innerHTML='<div class="login"><div class="empty">'+(ERRO?'<b>'+esc(ERRO)+'</b><span>'+esc(EM)+'</span><button class="btn" data-act="sair">Sair</button>':'<b>Carregando…</b>')+'</div></div>';return;}
  var Q=convs().filter(function(c){var e=corDe(c);return e.cor==='vermelho'||(!e.cor&&e.alerta);}).length, m=minAtras(D.geradoEm), velho=m==null||m>15; /* (19/11) número da aba = marcadas Caso sério + sem marca com alerta */
  var C=chips(), cs=S.num?C.filter(function(c){return c.nome===S.num;})[0]:null;
  var tom=cs?(ST[cs.st]||ST.ok)[1]:(C.some(function(c){return ST[c.st]&&ST[c.st][1]==='bad';})?'bad':C.some(function(c){return c.st==='limite';})?'warn':'ok');
  var h='<header class="top"><button class="numsel" data-act="num" aria-haspopup="dialog" aria-label="Trocar número"><span class="dot '+tom+'"></span><span class="lb">'+esc(S.num||'Todos os números')+'</span>'+IC.down+'</button>'+(RT.vivo&&!velho?'<span class="sync"><span class="dot ok"></span>Ao vivo</span>':'<span class="sync'+(velho?' velho':'')+'">'+(velho?'Desatualizado · ':'')+hhmm(D.geradoEm)+'</span>')+'</header><main>';
  h+=S.tab==='agora'?vAgora():S.tab==='conversas'?(S.conv?vConv():vLista()):S.tab==='ia'?vIA():vEnvios();
  h+='</main><nav class="tabs" aria-label="Abas"><div class="in">';
  [['agora','Agora',IC.alert],['conversas','Conversas',IC.chat],['envios','Envios',IC.send],['ia','Perguntar',IC.ask]].forEach(function(t){h+='<button data-act="tab" data-id="'+t[0]+'" aria-current="'+(S.tab===t[0]?'page':'false')+'">'+t[2]+t[1]+(t[0]==='conversas'&&Q?'<span class="badge">'+Q+'</span>':'')+'</button>';});
  h+='</div></nav>';
  if(S.sheet) h+='<div class="scrim" data-act="fechar"><div class="sheet" role="dialog" aria-modal="true" aria-label="Detalhe"><span class="grab"></span>'+(S.sheet.k==='num'?vSheetNum():vSheetKpi(S.sheet.id))+'</div></div>';
  if(S.modal) h+='<div class="scrim" data-act="cancelar"><div class="sheet" role="dialog" aria-modal="true" aria-label="'+esc(S.modal.t)+'"><span class="grab"></span><h3>'+esc(S.modal.t)+'</h3><p>'+esc(S.modal.p)+'</p><div class="btns"><button class="btn" data-act="cancelar">Cancelar</button><button class="btn pri" data-act="ok">'+esc(S.modal.ok)+'</button></div></div></div>';
  if(S.marcar) h+=vMarcar();
  if(S.info==='cores') h+=vCores();
  if(S.toast) h+='<div class="toast" role="status">'+esc(S.toast)+'</div>';
  var foco=document.activeElement&&document.activeElement.id;
  app.innerHTML=h;
  var ta=document.getElementById('txt');
  if(ta){ta.addEventListener('input',function(){var antes=S.draft.split('\n').length>4;S.draft=ta.value;if((ta.value.split('\n').length>4)!==antes)render();});}
  var ak=document.getElementById('ask');
  if(ak){ak.addEventListener('input',function(){S.ask=ak.value;});ak.addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();perguntar(ak.value.trim());}});}
  /* (fase 3) a busca redesenha só a lista (e os filtros quando ela começa ou termina): o campo não é recriado a cada letra */
  var bu=document.getElementById('busca');
  if(bu){bu.addEventListener('input',function(){var tinha=!!S.busca.trim();S.busca=bu.value;if(!!S.busca.trim()!==tinha){var fi=document.getElementById('filtros');if(fi)fi.innerHTML=segFiltro();}var l=document.getElementById('lista');if(l)l.innerHTML=listaHTML();});}
  if(foco&&document.getElementById(foco)){var el=document.getElementById(foco);el.focus();if(el.setSelectionRange)try{el.setSelectionRange(el.value.length,el.value.length);}catch(x){}}
  /* (etapa 3) rolagem: ao abrir uma conversa ou o chat, e sempre que chega mensagem nova, desce até a última */
  var cv=S.tab==='conversas'&&S.conv&&acharConv(S.conv);
  var rol=cv?'c:'+cv.id+':'+cv.msgs.length+':'+(S.saidas[cv.id]||[]).length:(S.tab==='ia'&&S.iaSeg==='chat'?'i:'+S.chat.length+':'+S.chat.filter(function(m){return m.esperando;}).length:'');
  if(rol&&rol!==render.rol) requestAnimationFrame(function(){window.scrollTo(0,document.documentElement.scrollHeight);});
  render.rol=rol;
}

/* ---------- banco ---------- */
async function buscar(){
  var r=await SB.from('painel_dados').select('dados,atualizado_em').eq('id','app-whatsapp').maybeSingle();
  if(r.error){ERRO='Não consegui ler os dados';render();return;}
  if(!r.data){ERRO='Sem acesso a este app';D=null;render();return;}
  ERRO=''; D=r.data.dados; if(!D.geradoEm) D.geradoEm=r.data.atualizado_em;
  (D.chaves||[]).forEach(function(k){if(S.swLocal['k:'+k.nome]===!!k.ligada)delete S.swLocal['k:'+k.nome];}); /* o servidor já mostra o novo estado */
  (D.chips||[]).forEach(function(c){if(S.swLocal['c:'+c.conta]===!!c.envio)delete S.swLocal['c:'+c.conta];});
  limpaLocais();
  limpaResolv();
  iniciarTempoReal(D.dia); /* (fase D) liga uma vez por dia; sem a tabela, não faz nada */
  render();
}
function comecar(email){EM=email;render();buscar();carregarNotas().then(carregarChat,carregarChat);
  SB.from('al_papeis').select('papel').limit(1).maybeSingle().then( /* a regra do banco só deixa ler a própria linha */function(r){PAPEL=(r.data&&r.data.papel)||'';});clearInterval(TIMER);TIMER=setInterval(function(){if(!document.hidden)buscar();},30000);}
async function entrar(ev){
  ev.preventDefault(); S.entrando=true; S.loginErro=''; var em=document.getElementById('em').value.trim(), se=document.getElementById('se').value; render();
  var r=await SB.auth.signInWithPassword({email:em,password:se}); S.entrando=false;
  if(r.error){S.loginErro=r.error.message==='Invalid login credentials'?'E-mail ou senha incorretos.':'Não consegui entrar agora.';render();return;}
  comecar(r.data.user.email);
}
document.addEventListener('visibilitychange',function(){if(!document.hidden&&EM)buscar();});
document.addEventListener('click',function(ev){
  var el=ev.target.closest('[data-act]'); if(!el) return;
  var a=el.getAttribute('data-act'), id=el.getAttribute('data-id');
  if((a==='fechar'||a==='cancelar'||a==='cancelar-marca'||a==='fechar-info')&&el.classList.contains('scrim')&&ev.target!==el) return;
  var cv=S.conv&&acharConv(S.conv);
  switch(a){
    case 'resolver': if(!cv) return; /* (19/11) o Leonardo e o pai */
      S.modal={t:'Resolver '+String(cv.nome).split(' ')[0]+'?',p:'Marca como Resolvido e fecha as pendências abertas desta conversa. Fica assim até alguém trocar.',ok:'Resolvido',fazer:function(){marcarConv(cv,'verde');}}; break;
    case 'marcar': if(cv) S.marcar={id:cv.id,cor:null}; break;
    case 'cor': if(S.marcar) S.marcar.cor=id||''; break;
    case 'marcar-ok': if(S.marcar&&S.marcar.cor!=null){var mc=acharConv(S.marcar.id); if(mc) marcarConv(mc,S.marcar.cor);} return;
    case 'cancelar-marca': S.marcar=null; break;
    case 'cores': S.info='cores'; break;
    case 'fechar-info': S.info=null; break;
    case 'ficha': S.ficha=!S.ficha; break;
    case 'tentar': if(!cv) return; var mt=(cv.msgs||[])[+id]; if(mt&&mt.t) mandar('responder',String(mt.t).slice(0,600)); return;
    case 'enviar': if(S.draft.trim()&&cv) mandar('responder',S.draft.trim()); return;
    case 'pix': if(cv) mandar('pix','Pix: chave e titular'); return;
    case 'catalogo': if(cv) mandar('catalogo','Catálogo com os preços'); return;
    case 'assumir': if(!cv) return; if(assumida(cv)){trocarAssumir(cv,false);return;} S.modal={t:'Assumir '+String(cv.nome).split(' ')[0]+'?',p:'Robô para só com este cliente por 24 h.',ok:'Assumir',fazer:function(){trocarAssumir(cv,true);}}; break;
    case 'devolver': if(cv) trocarAssumir(cv,false); return;
    case 'ok': var f=S.modal&&S.modal.fazer; S.modal=null; if(f) f(); return;
    case 'cancelar': S.modal=null; break;
    case 'sw-chave': case 'sw-chip':
      if(PAPEL!=='admin'){toast('Só o Leonardo liga ou desliga');return;}
      var nm=el.getAttribute('data-nome'), ehChave=a==='sw-chave', on=el.getAttribute('aria-checked')==='true';
      S.modal={t:(on?'Desligar ':'Ligar ')+(ehChave?nm:'o envio do '+nm)+'?',
        p:ehChave?(on?'Para de mandar a partir do próximo ciclo. O já enviado fica.':'Começa a mandar no próximo ciclo, dentro do limite de cada chip.'):(on?'O chip para a lista de hoje; o atendimento continua. O robô do chip reinicia (cerca de 1 min).':'O chip volta à lista de hoje. O robô do chip reinicia (cerca de 1 min).'),
        ok:on?'Desligar':'Ligar',
        fazer:function(){ehChave?trocarSw('k:'+id,'chave',{nome:id,valor:on?0:1},!on,nm):trocarSw('c:'+id,'envio_chip',{conta:id,valor:on?0:1},!on,'Envio do '+nm);}};
      break;
    case 'ia-seg': S.iaSeg=id; if(id==='notas') carregarNotas(); break;
    case 'sug': perguntar(id); return;
    case 'ia-enviar': perguntar((S.ask||'').trim()); return;
    case 'nota-sim': salvarNota(+id); return;
    case 'nota-nao': var mn=S.chat[+id]; if(mn){mn.notaFeita='nao'; if(mn.id){DESC.push(mn.id);DESC=DESC.slice(-50);try{localStorage.setItem('app-notas-descartadas',JSON.stringify(DESC));}catch(e){}}} break;
    case 'ia-repetir': repetir(+id); return;
    case 'tab': S.tab=id; S.conv=null; break;
    case 'abrir': if(S.tab!=='conversas') S.dia='hoje'; S.tab='conversas'; S.conv=id; window.scrollTo(0,0); carregarHist(id); break;
    case 'ver-querem': case 'ver-antigas': case 'ver-vendedor':
      S.tab='conversas'; S.conv=null; S.dia='hoje'; S.busca=''; S.filtro=a==='ver-vendedor'?'amarelo':'vermelho'; window.scrollTo(0,0); break; /* (19/11) filtros por cor */
    case 'dia': S.dia=id; S.conv=null; if(id==='ontem') buscarOntem(); break;
    case 'ontem-de-novo': buscarOntem(true); return;
    case 'filtro': S.filtro=id; break;
    case 'voltar': S.conv=null; break;
    case 'ord': S.ord=S.ord===+id?null:+id; S.tipo=null; break;
    case 'tipo': S.tipo=S.tipo===id?null:id; break;
    case 'num': S.sheet={k:'num'}; break;
    case 'pick-num': S.num=id||null; S.sheet=null; S.conv=null; S.ord=null; S.tipo=null; S.filtro='todas'; break;
    case 'kpi': S.sheet={k:'kpi',id:id}; break;
    case 'fechar': S.sheet=null; break;
    case 'sair': SB.auth.signOut().finally(function(){EM=null;D=null;DO=null;DO_ERRO='';S.sheet=null;S.chat=[];S.busca='';S.dia='hoje';S.resolvLocal={};S.marcaLocal={};S.marcar=null;S.info=null;S.hist={};if(RT.canal)try{SB.removeChannel(RT.canal);}catch(e){}RT={convs:null,canal:null,vivo:false,dia:''};PEND={};clearInterval(TIMER);render();}); return;
  }
  render();
});

/* ---------- início ---------- */
try{SB=window.supabase.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY);}catch(e){SB=null;}
if(!SB){document.getElementById('app').innerHTML='<div class="login"><div class="empty"><b>Sem conexão</b><span>Recarregue a página</span></div></div>';return;}
window.__appWhats={tempoReal:function(dia){return iniciarTempoReal(dia);},carregar:function(p,banco,papel){if(banco)SB=banco;if(papel)PAPEL=papel;EM=EM||'teste';D=p;DO=null;DO_EM=0;limpaResolv();render();if(banco)carregarNotas().then(carregarChat,carregarChat);}}; /* só para a prova local com dado e banco inventados (com banco, recarrega as anotações, a conversa da aba Perguntar e o Ontem) */
SB.auth.getSession().then(function(r){var s=r.data&&r.data.session;if(s)comecar(s.user.email);else render();});
})();
